project_id = "mediclaro"

[auth]
site_url = "mediclaro://"
additional_redirect_urls = ["mediclaro://", "exp://*"]

[auth.email]
enable_signup = true
otp_length = 6
otp_expiry = 900

[auth.rate_limit]
email_sent = 10

# Stripe llama al webhook sin JWT de usuario: la seguridad es la firma HMAC.
[functions.stripe-webhook]
verify_jwt = false

[functions.identify-medicine]
verify_jwt = true

[functions.chat]
verify_jwt = true

[functions.create-checkout]
verify_jwt = true

[functions.customer-portal]
verify_jwt = true
